frontend:
  phases:
    build:
      commands:
        - npm run build

    postBuild:
      commands:
        - echo "🏗 Backend & frontend build completed — setting deployment variables..."
        - |
          if [ "$AWS_BRANCH" = "main" ]; then
            export ENVIRONMENT="prod"
          elif [ "$AWS_BRANCH" = "stage" ]; then
            export ENVIRONMENT="stage"
          else
            export ENVIRONMENT="dev"
          fi
        - export PROJECT_NAME="$PROJECT_NAME"
        - echo "📌 ENVIRONMENT = $ENVIRONMENT"
        - echo "📌 PROJECT_NAME = $PROJECT_NAME"
        - |
          echo "🚀 Running Dora script for branch: $AWS_BRANCH"
          chmod +x ./scripts/fetch-release.sh
          ./scripts/fetch-release.sh || echo "⚠️ DoraMetrics script failed — continuing build..."
        #  npm run doromatrix:watch || echo "⚠️ Dora script failed — continuing build..."

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
